name: github-publish

# Publishes as @geebos/pi-guard (GitHub Packages requires a scope).
# Source package name stays "pi-guard" for npm.
# Trigger is tag-only to avoid double-publish with GitHub Releases.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve git ref
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *)
              echo "Tag must look like v1.2.3, got: $TAG"
              exit 1
              ;;
          esac
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG ($VERSION)"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@geebos"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Sync package version from tag
        run: |
          npm version "${{ steps.meta.outputs.version }}" \
            --no-git-tag-version \
            --allow-same-version

      - name: Scope package for GitHub Packages
        run: |
          npm pkg set name=@geebos/pi-guard
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm pkg set publishConfig.access=restricted

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
